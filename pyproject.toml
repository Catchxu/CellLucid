[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "celllucid"
version = "0.1.0"
description = "Natural-language querying of single-cell atlases through interpretable topic modeling"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "torch>=2.5", "anndata>=0.11,<0.13", "numpy>=1.26",
  "scipy>=1.13", "pandas>=2", "h5py>=3.10", "PyYAML>=6",
  "safetensors>=0.4", "requests>=2.32", "omegaconf>=2.3,<2.4",
  "huggingface_hub>=0.30,<2.0",
]
[project.optional-dependencies]
backbone = ["pytorch-lightning>=2.5,<3", "scanpy>=1.11,<2", "hydra-core==1.3.2"]
dev = ["pytest>=8", "ruff>=0.9"]
# Install the pinned upstream package separately with --no-deps on Blackwell;
# see docs/pretraining.md for upstream dependency compatibility.
[project.scripts]
celllucid-preprocess = "celllucid.tasks.preprocess:main"
celllucid-dedup = "celllucid.data.dedup:main"
celllucid-build-cache = "celllucid.data.cache:main"
celllucid-train-topics = "celllucid.trainer.topic:main"
celllucid-export-topics = "celllucid.tasks.topic_bank:main"
celllucid-infer = "celllucid.tasks.inference:main"
[tool.hatch.build.targets.wheel]
packages = ["src/celllucid"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--basetemp=runs/pytest-tmp"
markers = ["integration: requires real TranscriptFormer assets or network"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
