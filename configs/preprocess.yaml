# Atlas-wide count preprocessing. Every source receives a coverage report.
batch_size: 128
min_genes: 200
shard_cells: 10000
validation_block: 1000000
# The first integer source is used, else the first holding log1p(counts), restored with
# expm1, else the first finite nonnegative one. raw.X is the raw matrix of anndata files
# written before 0.7.
count_sources: [layers/counts, layers/raw, raw, raw.X, X]
# Files whose library methods all match, and cells whose obs assay matches.
exclude_methods: [atac]
# Files measuring fewer backbone genes are excluded: MERFISH panels measure about 300,
# whole-transcriptome files over 11,000.
min_measured_genes: 1000
# Files excluded by name, with the reason recorded in their coverage report.
exclude_files:
  decidua.h5ad: >-
    holds every cell of vento18_10x.processed.h5ad and vento18_ss2.processed.h5ad under
    other names, so duplicate removal misses 9,670 of them
# A cell is a copy when a covered cell of an earlier file with the same obs name, or within
# one study the same 16-nt barcode, has this expressed-gene Jaccard on the shared genes.
duplicate_jaccard: 0.9
# Study-held-out validation: the five studies of the held-out evaluation pool
# (runs/eval_pools), fixed so that pool stays held out when studies are added.
validation_studies:
  - 3ce9ae94-c469-419a-9637-5d138a4e642f
  - b176d756-62d8-4933-83a4-8b026380262f
  - c1810dbc-16d2-45c3-b45e-3e675f88d87b
  - cc95ff89-2e68-4a08-a234-480eca21ce79
  - cd9d6360-ce38-4321-97df-f13c79e3cb84
