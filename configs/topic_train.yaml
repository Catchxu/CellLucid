seed: 42
device: cuda
output_dir: runs/pbmc_smoke
caches:
  - cache/embeddings/pbmc_masked.h5
model:
  n_topics: 16
  temperature: 0.1
  ot_epsilon: 0.1
  ot_iterations: 60
optimizer:
  lr: 0.005
  weight_decay: 0.0
batch_size: 16
epochs: 3
grad_clip: 1.0
# Explicit development-only cell split; use group_key for atlas evaluation.
split:
  validation_fraction: 0.2
  seed: 42
  group_key: null
  split_key: null
