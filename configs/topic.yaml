# Online pretraining: frozen encoder forwards and topic updates in the same loop.
backbone:
  checkpoint: assets/tf_sapiens
  device: cuda
  max_length: null
  compile_attention: false
  precision: bfloat16
model:
  n_topics: 128
  temperature: 0.1
  ot_epsilon: 0.03
  ot_iterations: 200
  projection_hidden: 512
training:
  seed: 42
  batch_size: 128
  encoder_batch_size: 16
  workers: 2
  mask_fraction: 0.25
  ot_weight: 10.0
  optimizer:
    lr: 0.001
    weight_decay: 0.0
  grad_clip: 1.0
  log_every_steps: 10
  save_every_steps: 1000
inference:
  topic_bank: assets/topic_bank
  gene_key: feature_id
  count_source: X
  batch_size: 2
