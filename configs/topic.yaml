# Online pretraining: frozen encoder forwards and topic updates in the same loop.
backbone:
  checkpoint: assets/tf_sapiens
  device: cuda
  max_length: null
  compile_attention: false
  precision: float32
model:
  n_topics: 16
  temperature: 0.1
  ot_epsilon: 0.1
  ot_iterations: 60
training:
  seed: 42
  batch_size: 128
  encoder_batch_size: 16
  workers: 2
  mask_fraction: 0.25
  optimizer:
    lr: 0.005
    weight_decay: 0.0
  grad_clip: 1.0
  log_every_steps: 10
  save_every_steps: 1000
inference:
  gene_key: feature_id
  count_source: X
  batch_size: 2
