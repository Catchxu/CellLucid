# Cache-based pretraining: encode every eligible cell once into a cache of frozen embeddings,
# then train the topic model in one pass over it. Inference encodes unmasked counts and needs
# no cache.
backbone:
  checkpoint: assets/tf_sapiens
  device: cuda
  max_length: null
  compile_attention: true
  compile_model: true
  precision: bfloat16
cache:
  seed: 42
  mask_fraction: 0.25
  encoder_batch_size: 64
  chunk_samples: 8192
  initialization_cells_per_study: 256
  evaluation_pools: runs/eval_pools
model:
  n_topics: 128
  temperature: 0.05
  ot_epsilon: 0.03
  ot_iterations: 200
  gene_prior_uniform_share: 0.01
  # Genes left out of the loss (regex over symbols): mtDNA protein genes, canonical cytosolic
  # ribosomal proteins and TCR/BCR V segments. null keeps every gene (the all_genes bank).
  excluded_genes: "^(MT-|RP[LS][0-9]+[AXY]?[0-9]*$|RPLP[0-2]$|RPSA$|TR[ABDG]V|IG[HKL]V)"
  gene_symbols: assets/gene_symbols.json
  kmeans_iterations: 100
training:
  seed: 42
  device: cuda
  batch_size: 2048
  compile_sinkhorn: true
  optimizer:
    lr: 0.001  # peak learning rate
    weight_decay: 0.0
  warmup_steps: 200
  min_lr: 1.0e-05
  grad_clip: 1.0
  log_every_steps: 50
  eval_every_steps: 200
  save_every_steps: 1000
evaluation:
  pools: runs/eval_pools
inference:
  topic_bank: assets/topic_banks/default
  # Topic usage from the TranscriptFormer embedding (embedding), or in gene space from the counts
  # with the dictionary fixed: bag-of-words maximum likelihood (fold_in) or starCAT-style NNLS (nnls).
  method: embedding
  gene_key: feature_id
  count_source: X
  batch_size: 64
